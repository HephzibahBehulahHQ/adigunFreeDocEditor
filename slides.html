<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>Adigun Slides</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="slides-page">
  <header class="sheets-header">
    <a href="./index.html">← Documents</a>
    <h1>Adigun Slides</h1>
    <span id="slides-save" role="status">Stored on this device</span>
  </header>
  <main class="slides-workspace">
    <div class="slides-actions" aria-label="Presentation actions">
      <label for="deck-title" class="sr-only">Presentation name</label>
      <input id="deck-title" maxlength="100" placeholder="Presentation name">
      <details name="slide-commands" class="command-menu"><summary>File</summary><div>
        <button id="slide-import" type="button">Open PowerPoint</button>
        <button id="slide-export" type="button">Download PowerPoint</button>
      </div></details>
      <details name="slide-commands" class="command-menu"><summary>Slide</summary><div>
        <button id="slide-add" type="button">New slide</button>
        <button id="slide-duplicate" type="button">Duplicate slide</button>
        <button id="slide-earlier" type="button">Move earlier</button>
        <button id="slide-later" type="button">Move later</button>
        <button id="slide-remove" type="button">Delete slide</button>
      </div></details>
      <details name="slide-commands" class="command-menu"><summary>Slide Show</summary><div>
        <button id="slide-present" type="button">Present from current slide</button>
      </div></details>
      <a class="button button-outline" href="./ai.html?kind=slides">Draft with AI</a>
      <input id="slide-file" type="file" accept=".pptx,application/vnd.openxmlformats-officedocument.presentationml.presentation" hidden>
    </div>
    <div class="slides-layout">
      <aside class="slides-sidebar" aria-label="Slides">
        <ol id="slide-list"></ol>
      </aside>
      <section class="slides-paper" aria-label="Current slide">
        <label for="slide-title" class="sr-only">Slide title</label>
        <input id="slide-title" maxlength="120" placeholder="Slide title">
        <label for="slide-content" class="sr-only">Slide text</label>
        <textarea id="slide-content" maxlength="1500" placeholder="Add slide text"></textarea>
      </section>
    </div>
  </main>
  <dialog id="slide-show" class="slide-show" aria-label="Present slides">
    <section class="slides-paper">
      <h2 id="present-title"></h2>
      <div id="present-content"></div>
    </section>
    <div class="slides-actions">
      <button id="present-prev" class="button button-outline" type="button">Previous</button>
      <output id="present-count"></output>
      <button id="present-next" class="button button-outline" type="button">Next</button>
      <button id="present-close" class="button button-outline" type="button">Close</button>
    </div>
  </dialog>
  <script src="./assets/vendor/fflate.min.js" defer></script>
  <script src="./presentation-package.js" defer></script>
  <script src="./slides.js" defer></script>
</body>
</html>

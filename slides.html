<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>Adigun Slides</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="slides-page">
  <header class="sheets-header">
    <h1>Adigun <span class="suite-product">Slides</span></h1>
    <nav class="suite-switcher" aria-label="Office editors">
        <a href="./index.html" target="_blank" rel="noopener" aria-label="Docs (opens in a new tab)">Docs</a>
        <a href="./sheets.html" target="_blank" rel="noopener" aria-label="Sheets (opens in a new tab)">Sheets</a>
        <span aria-current="page">Slides</span>
        <a href="./pdf.html" target="_blank" rel="noopener" aria-label="PDF (opens in a new tab)">PDF</a>
      </nav>
    <span id="slides-save" role="status">Stored on this device</span>
  </header>
  <main class="slides-workspace">
    <div class="slides-actions" aria-label="Presentation actions">
      <label for="deck-title" class="sr-only">Presentation name</label>
      <input id="deck-title" maxlength="100" placeholder="Presentation name">
      <details name="slide-commands" class="command-menu"><summary>File</summary><div>
        <button id="slide-import" type="button">Open PowerPoint</button>
        <button id="slide-export" type="button">Download PowerPoint</button>
      </div></details>
      <details name="slide-commands" class="command-menu"><summary>Slide</summary><div>
        <button id="slide-add" type="button">New slide</button>
        <button id="slide-duplicate" type="button">Duplicate slide</button>
        <button id="slide-earlier" type="button">Move earlier</button>
        <button id="slide-later" type="button">Move later</button>
        <button id="slide-remove" type="button">Delete slide</button>
      </div></details>
      <details name="slide-commands" class="command-menu"><summary>Slide Show</summary><div>
        <button id="slide-present-start" type="button">Present from beginning</button>
        <button id="slide-present" type="button">Present from current slide</button>
      </div></details>
      <details name="slide-commands" class="command-menu"><summary>Design</summary><div>
        <button type="button" data-slide-theme="paper">Paper</button>
        <button type="button" data-slide-theme="violet">Violet</button>
        <button type="button" data-slide-theme="midnight">Midnight</button>
      </div></details>
      <details name="slide-commands" class="command-menu"><summary>Animations</summary><div>
        <button id="slide-animate" type="button">Animation settings</button>
      </div></details>
      <a class="button button-outline" href="./ai.html?kind=slides">Draft with AI</a>
      <input id="slide-file" type="file" accept=".pptx,application/vnd.openxmlformats-officedocument.presentationml.presentation" hidden>
    </div>
    <div class="slides-layout">
      <aside class="slides-sidebar" aria-label="Slides">
        <ol id="slide-list"></ol>
      </aside>
      <section class="slides-paper" aria-label="Current slide">
        <label for="slide-title" class="sr-only">Slide title</label>
        <input id="slide-title" maxlength="120" placeholder="Slide title">
        <label for="slide-content" class="sr-only">Slide text</label>
        <textarea id="slide-content" maxlength="1500" placeholder="Add slide text"></textarea>
      </section>
    </div>
  </main>
  <dialog id="slide-animation-dialog" class="pdf-tool-dialog" aria-labelledby="slide-animation-title">
    <h2 id="slide-animation-title">Slide animation</h2>
    <form>
      <label>Effect
        <select name="effect">
          <option value="none">None</option>
          <optgroup label="Entrance"><option value="fade">Fade in</option><option value="rise">Rise in</option></optgroup>
          <optgroup label="Emphasis"><option value="pulse">Pulse</option></optgroup>
          <optgroup label="Exit"><option value="exit">Fade out</option></optgroup>
          <optgroup label="Motion paths"><option value="drift">Side to side</option></optgroup>
        </select>
      </label>
      <label>Apply to <select name="target"><option value="both">Title and text</option><option value="title">Title</option><option value="content">Text</option></select></label>
      <label>Start <select name="start"><option value="auto">When slide opens</option><option value="manual">When Play effect is pressed</option></select></label>
      <label>Duration (seconds) <input name="duration" type="number" min="0.1" max="5" step="0.1" required></label>
      <label>Delay (seconds) <input name="delay" type="number" min="0" max="10" step="0.1" required></label>
      <p>Effects play in the browser slideshow. PowerPoint exports contain static slides.</p>
      <div class="slides-actions">
        <button class="button button-outline" type="submit">Save effect</button>
        <button class="button button-outline" type="button" data-close>Cancel</button>
      </div>
    </form>
  </dialog>
  <dialog id="slide-show" class="slide-show" aria-label="Present slides">
    <section class="slides-paper">
      <h2 id="present-title"></h2>
      <div id="present-content"></div>
    </section>
    <div class="slides-actions">
      <button id="present-prev" class="button button-outline" type="button">Previous</button>
      <output id="present-count"></output>
      <button id="present-next" class="button button-outline" type="button">Next</button>
      <button id="present-play" class="button button-outline" type="button" hidden>Play effect</button>
      <button id="present-close" class="button button-outline" type="button">Close</button>
    </div>
  </dialog>
  <script src="./assets/vendor/fflate.min.js" defer></script>
  <script src="./presentation-package.js" defer></script>
  <script src="./slides.js" defer></script>
</body>
</html>

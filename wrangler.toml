name = "adigunfreedoceditor-account-preview"
main = "cloudflare/index.mjs"
compatibility_date = "2026-11-22"
workers_dev = true
preview_urls = false

[vars]
PRODUCT_ACCOUNT_PREFIX = "adigunfreedoceditor_preview"

[assets]
directory = ".wrangler/account-assets"
binding = "ASSETS"
run_worker_first = ["/api/account"]

[[ratelimits]]
name = "ACCOUNT_LIMITER"
namespace_id = "1"
simple = { limit = 10, period = 60 }

[env.production]
name = "adigunfreedoceditor-product"
workers_dev = false
preview_urls = false
routes = [{ pattern = "adigunfreedoceditor.hephzibahbehulah.com/*", zone_name = "hephzibahbehulah.com" }]

[env.production.vars]
PRODUCT_ACCOUNT_PREFIX = "adigunfreedoceditor"

[env.production.assets]
directory = ".wrangler/account-assets"
binding = "ASSETS"
run_worker_first = ["/api/account"]

[[env.production.ratelimits]]
name = "ACCOUNT_LIMITER"
namespace_id = "2"
simple = { limit = 10, period = 60 }

name: Deploy static content to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate document model
        run: |
          node --check app.js
          node --check document-model.js
          node tests/document-model.test.cjs
          node tests/docx-image-export.test.cjs
          node tests/responsive-panels.test.cjs
          node tests/assistant-tools.test.cjs
      - name: Package application
        run: |
          mkdir -p _site/assets/vendor
          cp index.html styles.css app.js document-model.js CNAME _site/
          cp assets/hb-official.jpg _site/assets/
          cp assets/vendor/mammoth.browser.min.js assets/vendor/MAMMOTH-LICENSE _site/assets/vendor/
          python - <<'PY'
          import os
          from pathlib import Path

          index = Path("_site/index.html")
          html = index.read_text()
          version = os.environ["GITHUB_SHA"]
          for asset in ("styles.css", "document-model.js", "app.js"):
              html = html.replace(f'./{asset}"', f'./{asset}?v={version}"')
          index.write_text(html)
          PY
          touch _site/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}


name: Deploy static content to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned editor schema dependencies
        run: npm ci
      - name: Build the bundled live editor runtime
        run: npm run build:editor
      - name: Check structured editor schema compatibility
        run: npm run test:editor-schema
      - name: Check editor HTML import and export compatibility
        run: npm run test:editor-html
      - name: Check live editor transactions and page sheets
        run: npm run test:live-editor
      - name: Check application live editor lifecycle
        run: npm run test:app-live-editor
      - name: Check responsive landing layout
        run: node tests/landing-layout.test.cjs
      - name: Validate document model
        run: |
          node --check app.js
          node --check document-model.js
          node tests/document-model.test.cjs
          node tests/document-pagination.test.cjs
          node tests/docx-image-export.test.cjs
          node tests/responsive-panels.test.cjs
          node tests/tablet-layout.test.cjs
          node tests/assistant-tools.test.cjs
          node tests/local-data-privacy.test.cjs
          node tests/assistant-docked-layout.test.cjs
          node tests/document-tabs.test.cjs
          node tests/page-navigation-thumbnails.test.cjs
          node tests/mobile-header.test.cjs
          node tests/stage-action-target-size.test.cjs
          node tests/save-status.test.cjs
          node tests/keyboard-accessibility.test.cjs
          node tests/text-contrast.test.cjs
          node tests/conversion-layout.test.cjs
          node tests/workspace-chrome.test.cjs
          node tests/review-navigation.test.cjs
          node tests/review-target-size.test.cjs
          node tests/zoom-target-size.test.cjs
          node tests/document-ruler-target-size.test.cjs
          node tests/docx-revision-warning.test.cjs
          node tests/docx-revision-detection.test.cjs
          node tests/find-checkbox-target-size.test.cjs
          node tests/navigation-current.test.cjs
          node tests/ribbon-tabs.test.cjs
          node tests/mobile-menu-keyboard.test.cjs
          node tests/mobile-menu-outside-click.test.cjs
          node tests/file-picker-labels.test.cjs
          node tests/assistant-panel-state.test.cjs
          node tests/sheet-model.test.mjs
          node tests/presentation-package.test.mjs
          node tests/pdf-pages.test.mjs
          node tests/ai-relay.test.mjs
      - name: Package application
        run: |
          mkdir -p _site/assets/vendor
          cp index.html styles.css app.js document-model.js editor-runtime.js sheets.html sheets.js sheet-model.js sheet-xlsx.js slides.html slides.js presentation-package.js pdf.html pdf-workspace.js pdf-pages.js ai.html ai-draft.js ai-draft-model.js CNAME _site/
          cp pdf-ocr.js pdf-redact.js pdf-render.js pdf-forms.js _site/
          cp assets/hb-official.jpg _site/assets/
          python scripts/assemble_pdfjs.py
          npm run build:pdf
          npm run build:ocr
          cp -r assets/vendor/ocr _site/assets/vendor/
          cp assets/vendor/pdf-lib.min.js assets/vendor/PDF-LIB-LICENSE.md _site/assets/vendor/
          cp assets/vendor/mammoth.browser.min.js assets/vendor/MAMMOTH-LICENSE assets/vendor/fflate.min.js assets/vendor/FFLATE-LICENSE assets/vendor/pdf.min.js assets/vendor/pdf.worker.min.js assets/vendor/PDFJS-LICENSE _site/assets/vendor/
          cp node_modules/@tiptap/core/LICENSE.md _site/assets/vendor/TIPTAP-LICENSE.md
          cp node_modules/@tiptap/pm/LICENSE node_modules/@tiptap/pm/THIRD_PARTY_LICENSES.md _site/assets/vendor/
          python - <<'PY'
          import os
          from pathlib import Path

          index = Path("_site/index.html")
          html = index.read_text()
          version = os.environ["GITHUB_SHA"]
          for asset in ("styles.css", "document-model.js", "editor-runtime.js", "presentation-package.js", "app.js", "assets/vendor/fflate.min.js", "assets/vendor/pdf.min.js", "assets/vendor/pdf.worker.min.js"):
              html = html.replace(f'./{asset}"', f'./{asset}?v={version}"')
          index.write_text(html)
          slides = Path("_site/slides.html")
          html = slides.read_text()
          for asset in ("styles.css", "slides.js", "presentation-package.js", "assets/vendor/fflate.min.js"):
              html = html.replace(f'./{asset}"', f'./{asset}?v={version}"')
          slides.write_text(html)
          pdf = Path("_site/pdf.html")
          html = pdf.read_text()
          for asset in ("styles.css", "pdf-workspace.js", "assets/vendor/pdf-lib.min.js", "assets/vendor/pdf.min.js", "assets/vendor/ocr/tesseract.min.js"):
              html = html.replace(f'./{asset}"', f'./{asset}?v={version}"')
          pdf.write_text(html)
          for module in ("pdf-workspace.js", "pdf-ocr.js", "pdf-redact.js", "pdf-render.js"):
              source = Path("_site") / module
              code = source.read_text()
              for dependency in ("pdf-pages.js", "pdf-ocr.js", "pdf-redact.js", "pdf-render.js", "pdf-forms.js", "assets/vendor/pdf.worker.min.js"):
                  code = code.replace(f'"./{dependency}"', f'"./{dependency}?v={version}"')
              source.write_text(code)
          ai = Path("_site/ai.html")
          html = ai.read_text()
          for asset in ("styles.css", "ai-draft.js", "presentation-package.js", "assets/vendor/fflate.min.js"):
              html = html.replace(f'./{asset}"', f'./{asset}?v={version}"')
          ai.write_text(html)
          ai_module = Path("_site/ai-draft.js")
          ai_module.write_text(ai_module.read_text().replace('"./ai-draft-model.js"', f'"./ai-draft-model.js?v={version}"'))
          sheets = Path("_site/sheets.html")
          html = sheets.read_text()
          for asset in ("styles.css", "sheets.js", "assets/vendor/fflate.min.js"):
              html = html.replace(f'./{asset}"', f'./{asset}?v={version}"')
          sheets.write_text(html)
          for module in ("sheets.js", "sheet-xlsx.js"):
              source = Path("_site") / module
              code = source.read_text()
              for dependency in ("sheet-model.js", "sheet-xlsx.js"):
                  code = code.replace(f'"./{dependency}"', f'"./{dependency}?v={version}"')
              source.write_text(code)
          PY
          touch _site/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
      - name: Wait for Pages artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for attempt in {1..12}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --method GET -f name="$ARTIFACT_NAME" \
              --jq '.artifacts[] | select(.expired == false) | .id' | grep -q '[0-9]'; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::GitHub did not list the uploaded Pages artifact within one minute."
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}







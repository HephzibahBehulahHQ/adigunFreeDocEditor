name: Deploy static content to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned editor schema dependencies
        run: npm ci
      - name: Build the bundled live editor runtime
        run: npm run build:editor
      - name: Check structured editor schema compatibility
        run: npm run test:editor-schema
      - name: Check editor HTML import and export compatibility
        run: npm run test:editor-html
      - name: Check live editor transactions and page sheets
        run: npm run test:live-editor
      - name: Validate document model
        run: |
          node --check app.js
          node --check document-model.js
          node tests/document-model.test.cjs
          node tests/document-pagination.test.cjs
          node tests/docx-image-export.test.cjs
          node tests/responsive-panels.test.cjs
          node tests/tablet-layout.test.cjs
          node tests/assistant-tools.test.cjs
          node tests/local-data-privacy.test.cjs
          node tests/assistant-docked-layout.test.cjs
          node tests/document-tabs.test.cjs
          node tests/page-navigation-thumbnails.test.cjs
          node tests/mobile-header.test.cjs
          node tests/stage-action-target-size.test.cjs
          node tests/save-status.test.cjs
          node tests/keyboard-accessibility.test.cjs
          node tests/text-contrast.test.cjs
          node tests/conversion-layout.test.cjs
          node tests/workspace-chrome.test.cjs
          node tests/review-navigation.test.cjs
          node tests/review-target-size.test.cjs
          node tests/zoom-target-size.test.cjs
          node tests/document-ruler-target-size.test.cjs
          node tests/docx-revision-warning.test.cjs
          node tests/docx-revision-detection.test.cjs
          node tests/find-checkbox-target-size.test.cjs
          node tests/navigation-current.test.cjs
          node tests/ribbon-tabs.test.cjs
          node tests/mobile-menu-keyboard.test.cjs
          node tests/mobile-menu-outside-click.test.cjs
          node tests/file-picker-labels.test.cjs
          node tests/assistant-panel-state.test.cjs
      - name: Package application
        run: |
          mkdir -p _site/assets/vendor
          cp index.html styles.css app.js document-model.js editor-runtime.js CNAME _site/
          cp assets/hb-official.jpg _site/assets/
          cp assets/vendor/mammoth.browser.min.js assets/vendor/MAMMOTH-LICENSE _site/assets/vendor/
          cp node_modules/@tiptap/core/LICENSE.md _site/assets/vendor/TIPTAP-LICENSE.md
          cp node_modules/@tiptap/pm/LICENSE node_modules/@tiptap/pm/THIRD_PARTY_LICENSES.md _site/assets/vendor/
          python - <<'PY'
          import os
          from pathlib import Path

          index = Path("_site/index.html")
          html = index.read_text()
          version = os.environ["GITHUB_SHA"]
          for asset in ("styles.css", "document-model.js", "editor-runtime.js", "app.js"):
              html = html.replace(f'./{asset}"', f'./{asset}?v={version}"')
          index.write_text(html)
          PY
          touch _site/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}






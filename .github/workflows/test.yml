name: Validate document editor

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax and document behavior
        run: |
          node --check app.js
          node --check document-model.js
          node tests/document-model.test.cjs
          node tests/docx-image-export.test.cjs
          node tests/table-editing.test.cjs
          node tests/document-ruler.test.cjs
          node tests/conversion-text.test.cjs
          node tests/responsive-panels.test.cjs
          node tests/tablet-layout.test.cjs
          node tests/assistant-tools.test.cjs


<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>Adigun Sheets</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="sheets-page">
  <header class="sheets-header">
    <h1>Adigun <span class="suite-product">Sheets</span></h1>
    <nav class="suite-switcher" aria-label="Office editors">
        <a href="./index.html" target="_blank" rel="noopener" aria-label="Docs (opens in a new tab)">Docs</a>
        <span aria-current="page">Sheets</span>
        <a href="./slides.html" target="_blank" rel="noopener" aria-label="Slides (opens in a new tab)">Slides</a>
        <a href="./pdf.html" target="_blank" rel="noopener" aria-label="PDF (opens in a new tab)">PDF</a>
      </nav>
    <span id="sheet-save" role="status">Stored on this device</span>
  </header>
  <main class="sheets-workspace">
    <div class="sheets-actions" aria-label="Workbook actions">
      <button id="sheet-undo" class="button button-outline" type="button" title="Undo workbook edit (Ctrl+Z)" disabled>Undo</button>
      <button id="sheet-redo" class="button button-outline" type="button" title="Redo workbook edit (Ctrl+Shift+Z)" disabled>Redo</button>
      <details name="sheet-commands" class="command-menu"><summary>File</summary><div>
        <button id="sheet-open" type="button">Open CSV</button>
        <button id="workbook-open" type="button">Open Excel</button>
        <button id="workbook-export" type="button">Download Excel</button>
        <button id="sheet-export" type="button">Download CSV</button>
      </div></details>
      <details name="sheet-commands" class="command-menu"><summary>Insert</summary><div>
        <button id="sheet-add-row" type="button">Add row</button>
        <button id="sheet-add-column" type="button">Add column</button>
        <button id="sheet-pivot" type="button">PivotTable</button>
      </div></details>
      <details name="sheet-commands" class="command-menu"><summary>Format</summary><div>
        <button type="button" data-sheet-format="general">General</button>
        <button type="button" data-sheet-format="number">Number (2 decimals)</button>
        <button type="button" data-sheet-format="percent">Percentage</button>
      </div></details>
      <details name="sheet-commands" class="command-menu"><summary>Formulas</summary><div>
        <button type="button" id="sheet-autosum">Sum cells above</button>
      </div></details>
      <details name="sheet-commands" class="command-menu"><summary>View</summary><div>
        <button type="button" id="sheet-gridlines" aria-pressed="true">Show gridlines</button>
        <button type="button" id="sheet-freeze-row" aria-pressed="false">Freeze first row</button>
      </div></details>
      <details name="sheet-commands" class="command-menu"><summary>Data</summary><div>
        <button type="button" id="sheet-find">Find in this sheet</button>
        <button type="button" id="sheet-pivot-refresh" disabled>Refresh PivotTable</button>
      </div></details>
      <input id="sheet-file" type="file" accept=".csv,text/csv" hidden>
      <input id="workbook-file" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
    </div>
    <div class="sheet-formula-line">
      <input id="sheet-selected" aria-label="Go to cell or range" value="A1" maxlength="9" autocomplete="off" spellcheck="false">
      <input id="sheet-formula" aria-label="Selected cell value or formula" maxlength="4000" autocomplete="off">
    </div>
    <p class="sheets-help" id="sheets-help">Use formulas such as =SUM(A1:A5) or ='Sheet 2'!$B$4. CSV downloads contain calculated values from the active sheet.</p>
    <div class="sheets-grid" tabindex="0" role="region" aria-label="Editable spreadsheet">
      <table id="sheet-grid" aria-label="Cells" aria-describedby="sheets-help"></table>
    </div>
    <div class="sheets-tab-bar" aria-label="Workbook sheets">
      <div id="sheet-tabs" role="group" aria-label="Select sheet"></div>
      <button id="sheet-add" type="button" class="button button-outline">＋ Sheet</button>
    </div>
    <footer class="sheet-status-bar" aria-label="Selection statistics">
      <span id="sheet-active-name"></span>
      <span id="sheet-selection-statistics"></span>
    </footer>
  </main>
  <dialog id="sheet-pivot-dialog" aria-labelledby="sheet-pivot-title">
    <form id="sheet-pivot-form">
      <h2 id="sheet-pivot-title">Create PivotTable</h2>
      <label>Source range with headers <input id="pivot-range" value="A1:B20" required></label>
      <label>Group by column <input id="pivot-group" value="A" maxlength="1" required></label>
      <label>Summarize column <input id="pivot-measure" value="B" maxlength="1" required></label>
      <label>Calculation <select id="pivot-aggregate"><option value="sum">Sum</option><option value="count">Count nonempty</option><option value="average">Average</option></select></label>
      <div class="sheets-actions"><button type="submit" class="button button-outline">Create on new sheet</button><button id="pivot-cancel" type="button" class="button button-outline">Cancel</button></div>
      <p id="pivot-status" role="status"></p>
    </form>
  </dialog>
  <dialog id="sheet-find-dialog" aria-labelledby="sheet-find-title">
    <form id="sheet-find-form">
      <h2 id="sheet-find-title">Find in this sheet</h2>
      <label>Value or formula <input id="sheet-find-query" type="search" required maxlength="100"></label>
      <button class="button button-outline" type="submit">Find next</button>
      <button class="button button-outline" id="sheet-find-close" type="button">Close</button>
      <p id="sheet-find-status" role="status"></p>
    </form>
  </dialog>
  <script src="./assets/vendor/fflate.min.js" defer></script>
  <script type="module" src="./sheets.js"></script>
</body>
</html>
